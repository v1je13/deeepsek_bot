name: DeepSeek Balance Checker

on:
  schedule:
    - cron: '*/15 * * * *' # СТРОГО КАЖДЫЕ 15 МИНУТ, круглосуточно и бесплатно
  workflow_dispatch: # Позволяет запускать вручную кнопкой

jobs:
  check-balance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python balance_alert.py
